name: CI

on:
  pull_request:
    branches: [master, phase-2-dev]
  push:
    branches: [master, phase-2-dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: apps/docs (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
        working-directory: apps/docs
      - run: npm run lint
        working-directory: apps/docs
      - run: npm test
        working-directory: apps/docs
      - run: npm run build
        working-directory: apps/docs
        env:
          # Next.js build (150+ effects, WebGL/Three.js) exceeds the default
          # heap on GitHub's standard 7GB runner without this.
          NODE_OPTIONS: --max-old-space-size=6144
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_DEV_URL: ${{ secrets.NEXT_PUBLIC_DEV_URL }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PRO_FOUNDING_YEARLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_FOUNDING_YEARLY_INR_PLAN_ID }}
          RAZORPAY_PRO_FOUNDING_YEARLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_FOUNDING_YEARLY_PLAN_ID }}
          RAZORPAY_PRO_MONTHLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_MONTHLY_INR_PLAN_ID }}
          RAZORPAY_PRO_MONTHLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_MONTHLY_PLAN_ID }}
          RAZORPAY_PRO_YEARLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_YEARLY_INR_PLAN_ID }}
          RAZORPAY_PRO_YEARLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_YEARLY_PLAN_ID }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  vault-main:
    name: vault-main (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vault-main/package-lock.json
      - run: npm ci
        working-directory: vault-main
      - run: npm run lint
        working-directory: vault-main
      - run: npm test
        working-directory: vault-main
      - run: npm run build
        working-directory: vault-main
        env:
          # Next.js build (150+ effects, WebGL/Three.js) exceeds the default
          # heap on GitHub's standard 7GB runner without this.
          NODE_OPTIONS: --max-old-space-size=6144
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_DEV_URL: ${{ secrets.NEXT_PUBLIC_DEV_URL }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PRO_FOUNDING_YEARLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_FOUNDING_YEARLY_INR_PLAN_ID }}
          RAZORPAY_PRO_FOUNDING_YEARLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_FOUNDING_YEARLY_PLAN_ID }}
          RAZORPAY_PRO_MONTHLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_MONTHLY_INR_PLAN_ID }}
          RAZORPAY_PRO_MONTHLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_MONTHLY_PLAN_ID }}
          RAZORPAY_PRO_YEARLY_INR_PLAN_ID: ${{ secrets.RAZORPAY_PRO_YEARLY_INR_PLAN_ID }}
          RAZORPAY_PRO_YEARLY_PLAN_ID: ${{ secrets.RAZORPAY_PRO_YEARLY_PLAN_ID }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  vault:
    name: hyperiux-vault (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hyperiux-vault/package-lock.json
      - run: npm ci
        working-directory: hyperiux-vault
      - run: npm run lint
        working-directory: hyperiux-vault
      - run: npm run build
        working-directory: hyperiux-vault
